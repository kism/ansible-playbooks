---
- name: Check SSH keys loaded
  delegate_to: localhost
  become: false
  run_once: true
  block:
    # env lookup instead of a command task, command is skipped in --check so the assert always failed
    - name: Make ssh assertion before we start
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', 'SSH_AUTH_SOCK') != ""
        fail_msg: |-
          No SSH_AUTH_SOCK set!
          if you are in vscode with agent forwarding, run:
          export SSH_AUTH_SOCK=$(ls -t /tmp/ssh-**/* | head -1)

    - name: Assert that secret_proxmox_password is set
      ansible.builtin.assert:
        that: secret_proxmox_password is defined
        fail_msg: "secret_proxmox_password is not set! Please set it in your vault or environment variables."

- name: Test become
  become: true
  ansible.builtin.ping:
