---
- name: Block with fun rescue
  block:
    # ponytail: rpm_key can't see this key (librpm refuses to parse it), so erase it directly; delete once all hosts are clean
    - name: Remove old influxdb key
      ansible.builtin.command:
        argv: [rpm, --erase, --allmatches, gpg-pubkey-9fc2f927]
      register: maintenance_update_packages_influx_key
      changed_when: maintenance_update_packages_influx_key.rc == 0 # rc 0 means the key was present and removed
      failed_when: # Already-absent key is fine
        - maintenance_update_packages_influx_key.rc != 0
        - "'is not installed' not in maintenance_update_packages_influx_key.stderr"

    - name: Update DNF Cache, list updates
      ansible.builtin.dnf:
        update_cache: true
        list: updates
      register: maintenance_update_packages_dnf_before

    - name: Wip update list to get changed
      ansible.builtin.debug: # WIP: nevra: 0:telegraf-1.30.2-1.aarch64
        msg: "{{ maintenance_update_packages_dnf_before }}"

    - name: Update dnf packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true
      register: maintenance_update_packages_dnf_update
  rescue:
    - name: Run cleaning commands
      ansible.builtin.command:
        cmd: dnf clean all
      changed_when: true # Probably true if we are here

    - name: Ensure removed cache
      ansible.builtin.file:
        path: /var/cache/dnf
        state: absent

    - name: Clear dnf cache
      ansible.builtin.command:
        cmd: dnf makecache --assumeyes
      changed_when: true # Technically untrue

    - name: Update dnf packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true
      register: maintenance_update_packages_dnf_update

- name: Get only installed # WIP telegraf-1.30.2-1.aarch64
  ansible.builtin.set_fact:
    maintenance_update_packages_changed:
      host: "{{ ansible_facts['hostname'] }}"
      packages: "{{ maintenance_update_packages_dnf_update.results | select('match', '^Installed: ') | map('regex_replace', '^Installed: ', '') | list }}"

- name: Set fact for maintenance_update_packages_changed {{ ansible_facts["pkg_mgr"] }}
  ansible.builtin.set_fact:
    maintenance_update_packages_changed: "{{ [maintenance_update_packages_changed] | to_yaml(default_flow_style=False) }}"
