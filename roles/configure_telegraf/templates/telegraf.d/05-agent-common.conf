# ponytail: only the settings we care about, everything else is telegraf's default
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  skip_processors_after_aggregators = true # silences the v1.41 default change warning, we have no aggregators
