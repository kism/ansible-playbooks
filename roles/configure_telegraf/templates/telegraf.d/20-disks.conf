[[inputs.sensors]]
[[inputs.smart]]
  interval = "240s"
  path_smartctl = "/usr/sbin/smartctl"
  path_nvme = "/usr/sbin/nvme"
  use_sudo = true
[[inputs.diskio]]
  devices = ["*"]
  name_templates = ["$DM_NAME"] # LVM volumes show as pve-vm--111--disk--0 instead of dm-3, plain disks keep their name
