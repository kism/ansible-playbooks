---
- name: Install telegraf from the AUR
  become: true # lint wants it beside become_user
  become_user: "{{ homelab_my_username }}" # yay refuses to run as root
  kewlfft.aur.aur:
    name: telegraf
    use: yay
    state: present

- name: Add telegraf user to input group
  ansible.builtin.user:
    name: telegraf
    groups: input
    append: true
