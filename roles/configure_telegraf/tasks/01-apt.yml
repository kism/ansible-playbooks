---
- name: Add influxdata apt repository
  ansible.builtin.deb822_repository:
    name: influxdata
    types: deb
    uris: https://repos.influxdata.com/{{ ansible_facts['distribution'] | lower }}
    suites: stable
    components: main
    architectures: [amd64, arm64] # influxdata has no i386, avoids apt warnings on multiarch hosts
    signed_by: https://repos.influxdata.com/influxdata-archive.key
    install_python_debian: true
    state: present
