---
- name: Install telegraf {{ ansible_facts["distribution"] + ansible_facts["pkg_mgr"] }}
  become: true
  become_method: ansible.builtin.sudo
  become_user: "{{ homelab_my_username }}"
  kewlfft.aur.aur:
    name: "telegraf"
    use: yay
    state: present

- name: Add telegraf user to input group
  ansible.builtin.user:
    name: telegraf
    groups: input
    append: true
    state: present
