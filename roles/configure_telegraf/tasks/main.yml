---
- name: Include repo tasks for {{ ansible_facts['pkg_mgr'] }}
  ansible.builtin.include_tasks: "01-{{ ansible_facts['pkg_mgr'] }}.yml"

- name: Install telegraf
  ansible.builtin.package:
    name: telegraf
    state: present
  when: ansible_facts['pkg_mgr'] != 'pacman' # installed from the AUR in 01-pacman.yml

# Detection, feeds configure_telegraf_configs in vars/main.yml
- name: Populate service facts
  ansible.builtin.service_facts:

# service_facts keeps not-found units after uninstall
- name: Get services that are installed
  ansible.builtin.set_fact:
    configure_telegraf_existing_services: >-
      {{ ansible_facts['services'] | dict2items
         | selectattr('value.status', 'defined')
         | rejectattr('value.status', 'eq', 'not-found')
         | map(attribute='key') }}

- name: Get list of services we want to monitor, that are on the host
  ansible.builtin.set_fact:
    # Sort means that it won't trigger a change unless needed, as facts don't end up in order
    configure_telegraf_common_services: "{{ configure_telegraf_service_allowlist | intersect(configure_telegraf_existing_services) | sort }}"

- name: Check if rocm-smi is installed
  ansible.builtin.command:
    argv: [sh, -c, "command -v rocm-smi"] # which isn't on minimal EL installs
  register: configure_telegraf_rocm_smi_installed
  failed_when: false # Just checking
  changed_when: false # Just checking
  check_mode: false # read-only, needs to run in --check or .rc is undefined

- name: Check if /etc/pve exists
  ansible.builtin.stat:
    path: /etc/pve
  register: configure_telegraf_pve_status

# Permissions the inputs need
- name: Add telegraf user to docker group
  ansible.builtin.user:
    name: telegraf
    groups: docker
    append: true
  when: configure_telegraf_configs['20-docker.conf']
  notify: Restart telegraf

- name: Copy the telegraf sudoers rule for smartctl, nvme, lvm and btrfs stats
  ansible.builtin.copy:
    src: sudoers_telegraf_disk
    dest: /etc/sudoers.d/telegraf_disk
    mode: "0440"
    validate: visudo -cf %s
  when: configure_telegraf_configs['20-disks.conf'] or configure_telegraf_configs['20-proxmox.conf'] or configure_telegraf_configs['20-btrfs.conf']

- name: Copy the btrfs device stats script
  ansible.builtin.copy:
    src: telegraf_btrfs_stats.sh
    dest: /usr/local/bin/telegraf_btrfs_stats.sh
    mode: "0755"
  when: configure_telegraf_configs['20-btrfs.conf']

# ponytail: one-off cleanup, btrfs stats used to get applied to guests. Remove once run on myr.
- name: Remove btrfs stats script and sudoers rule from guests
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/telegraf_btrfs_stats.sh
    - /etc/sudoers.d/telegraf_disk
  when: ansible_facts['virtualization_role'] == 'guest'

# Configs
- name: Empty out the default config file
  ansible.builtin.copy:
    content: ""
    dest: /etc/telegraf/telegraf.conf
    mode: "0644"
    group: telegraf
  notify: Restart telegraf

- name: "Template telegraf config: output, influxdb"
  ansible.builtin.template:
    src: telegraf.d/10-influxdb-output.conf
    dest: /etc/telegraf/telegraf.d/10-influxdb-output.conf
    group: telegraf
    mode: "0640"
  diff: false # contains the victoriametrics bearer token
  notify: Restart telegraf

- name: Template telegraf configs
  ansible.builtin.template:
    src: telegraf.d/{{ item }}
    dest: /etc/telegraf/telegraf.d/{{ item }}
    group: telegraf
    mode: "0644"
  loop: "{{ configure_telegraf_wanted_configs }}"
  notify: Restart telegraf

- name: Find telegraf configs
  ansible.builtin.find:
    paths: /etc/telegraf/telegraf.d
    hidden: true
    excludes:
      - local-* # hand-written host configs that don't belong in a public repo, never touched
      - .ignore # placeholder shipped by the telegraf package, comes back on every upgrade
  register: configure_telegraf_found_configs

- name: Remove telegraf configs this host shouldn't have
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ configure_telegraf_found_configs.files | map(attribute='path') | map('basename')
            | difference(configure_telegraf_wanted_configs + ['10-influxdb-output.conf'])
            | map('regex_replace', '^', '/etc/telegraf/telegraf.d/') }}"
  notify: Restart telegraf

- name: Enable telegraf service
  ansible.builtin.service:
    name: telegraf
    enabled: true
    state: started
