---
# Every file in /etc/telegraf/telegraf.d that isn't true here (or the influxdb output) gets deleted, except local-*.conf
configure_telegraf_configs:
  05-agent-common.conf: true
  15-telegraf-common.conf: true
  20-systemd-services.conf: true
  20-disks.conf: "{{ ansible_facts['virtualization_role'] == 'host' }}"
  20-btrfs.conf: "{{ ansible_facts['virtualization_role'] == 'host' and ansible_facts['mounts'] | selectattr('fstype', 'equalto', 'btrfs') | list | length > 0 }}"
  20-proxmox.conf: "{{ configure_telegraf_pve_status.stat.exists and 'proxmoxhosts' in group_names }}" # make double sure
  20-docker.conf: "{{ 'docker.service' in configure_telegraf_existing_services }}"
  20-nvidia.conf: "{{ 'nvidia-persistenced.service' in configure_telegraf_existing_services }}"
  20-amdgpu.conf: "{{ configure_telegraf_rocm_smi_installed.rc == 0 }}"
configure_telegraf_wanted_configs: "{{ configure_telegraf_configs | dict2items | selectattr('value') | map(attribute='key') }}"

# Exact unit names, intersected with what's on the host so no globs (pve-container@* lives in 20-proxmox.conf)
configure_telegraf_service_allowlist:
  # System
  - sshd.service
  - firewalld.service
  - fail2ban.service
  - docker.service
  - systemd-journal-upload.service
  - nfs-kernel-server.service
  - smb.service
  - smbd.service
  # Proxmox
  - lxcfs.service
  - lxc-monitord.service
  - pve-lxc-syscalld.service
  - pve-cluster.service
  - pve-firewall.service
  - pvedaemon.service
  - pveproxy.service
  - pvescheduler.service
  # Apps
  - allowlistapp.service
  - archivepodcast.service
  - grafana-server.service
  - jellyfin.service
  - nginx.service
  - ollama.service
  - step-ca.service
  - tabby.service
  - factorio.service
  - mergerfs.service
  - navidrome.service
  - qbt-shaper.service
  # Compose wrapper units
  - victoriametrics.service
  - headscale.service
  - dispatcharr.service
  - docker-arr.service
  - docker-checkrr.service
  - docker-qbittorrent.service
  - docker-sabnzbd.service
