---
- name: Create pvpn directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /opt/pvpn
    - /opt/pvpn/gluetun
    - /opt/pvpn/tailscale

- name: Copy pvpn docker compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/pvpn/docker-compose.yml
    owner: root
    group: root
    mode: "0600"
  notify:
    - Restart pvpn
    - Print tailscale login instructions

- name: Pull images for docker-compose pvpn
  community.docker.docker_compose_v2_pull:
    project_src: /opt/pvpn

- name: Copy systemd service file for pvpn
  ansible.builtin.copy:
    src: pvpn.service
    dest: /etc/systemd/system/pvpn.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so systemd sees pvpn
  ansible.builtin.meta: flush_handlers

- name: Enable and start pvpn service
  ansible.builtin.systemd_service:
    name: pvpn
    enabled: true
    state: started
