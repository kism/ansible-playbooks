---
- name: Update DNF Cache {{ ansible_facts["distribution"] | lower + "-" + ansible_facts["distribution_major_version"] }}
  ansible.builtin.dnf:
    update_cache: true
    state: installed

- name: Oracle Linux Block {{ ansible_facts["distribution"] | lower + "-" + ansible_facts["distribution_major_version"] }}
  when: ansible_facts['distribution'] == "OracleLinux"
  block:
    - name: Remove duplicate repo definition {{ ansible_facts["distribution"] | lower + "-" + ansible_facts["distribution_major_version"] }}
      ansible.builtin.file:
        path: /etc/yum.repos.d/oracle-appstream-ol9.repo
        state: absent

    - name: Check for stock repo file {{ ansible_facts["distribution"] | lower + "-" + ansible_facts["distribution_major_version"] }}
      ansible.builtin.stat:
        path: /etc/yum.repos.d/oracle-linux-ol10.repo
      register: configure_package_manager_ol10_stock_repo

    # ponytail: minimal images (LXC) ship only baseos, stock installs already have ol10_appstream enabled
    - name: Add appstream repo {{ ansible_facts["distribution"] | lower + "-" + ansible_facts["distribution_major_version"] }}
      when: not configure_package_manager_ol10_stock_repo.stat.exists
      ansible.builtin.yum_repository:
        name: ol10_appstream
        description: Oracle Linux 10 Application Stream
        baseurl: https://yum.oracle.com/repo/OracleLinux/OL10/appstream/$basearch/
        gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-oracle
        gpgcheck: true
        enabled: true

- name: Enable epel {{ ansible_facts["distribution"] | lower + "-" + ansible_facts["distribution_major_version"] }}
  ansible.builtin.dnf:
    name: oracle-epel-release-el{{ ansible_facts['distribution_major_version'] }}
    state: present

- name: Update DNF Cache again {{ ansible_facts["distribution"] | lower + "-" + ansible_facts["distribution_major_version"] }}
  ansible.builtin.dnf:
    update_cache: true
