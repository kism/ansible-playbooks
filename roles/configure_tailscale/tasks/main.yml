---
- name: Add Tailscale repo
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/oracle/{{ ansible_facts['distribution_major_version'] }}/tailscale.repo
    dest: /etc/yum.repos.d/tailscale.repo
    mode: "0644"

- name: Install Tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present

- name: Start and enable tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
