---
- name: Copy firewalld service files for victoriametrics
  ansible.builtin.copy:
    src: firewalld/
    dest: /etc/firewalld/services/
    owner: root
    group: root
    mode: "0644"
  notify: Reload firewalld

- name: Flush handlers so firewalld knows the victoriametrics services
  ansible.builtin.meta: flush_handlers

- name: Allow victoriametrics through firewalld
  ansible.posix.firewalld:
    service: victoriametrics
    zone: public
    permanent: true
    state: enabled
  notify:
    - Reload firewalld

- name: Create data directories for victoriametrics and the victorialogs instances
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: 1000
    group: 1000
    mode: "0755"
  loop:
    - /var/lib/victoriametrics
    - /var/lib/victorialogs
    - /var/lib/victorialogs-firewall
    - /var/lib/geoip

- name: Ensure docker-compose directory exists
  ansible.builtin.file:
    path: /opt/victoriametrics
    state: directory
    mode: "0755"

- name: Copy docker-compose file victoriametrics
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: /opt/victoriametrics/docker-compose.yml
    mode: "0644"
  notify: Restart victoriametrics

- name: Copy vector config
  ansible.builtin.copy:
    src: vector.yaml
    dest: /opt/victoriametrics/vector.yaml
    mode: "0644"
  notify: Restart vector

- name: Copy geoipupdate env file
  ansible.builtin.template:
    src: geoipupdate.env.j2
    dest: /opt/victoriametrics/geoipupdate.env
    mode: "0600"
  diff: false # contains the maxmind license key
  notify: Restart victoriametrics

- name: Copy auth.yml file
  ansible.builtin.template:
    src: auth.yml.j2
    dest: /opt/victoriametrics/auth.yml
    mode: "0640"
    owner: 1000
    group: 1000
  notify: Restart victoriametrics

- name: Copy systemd units for victoriametrics and the vector geoip reload
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - victoriametrics.service
    - vector-geoip-reload.service
    - vector-geoip-reload.timer
  notify: Reload systemd

- name: Flush handlers so systemd sees victoriametrics
  ansible.builtin.meta: flush_handlers

- name: Enable and start victoriametrics service
  ansible.builtin.systemd_service:
    name: victoriametrics
    enabled: true
    state: started

# Vector only reads the mmdb at startup or on SIGHUP (tested 2026-11-24, swapping the file alone does nothing)
- name: Enable vector geoip reload timer
  ansible.builtin.systemd_service:
    name: vector-geoip-reload.timer
    enabled: true
    state: started
