---
- name: Copy firewalld service files for victoriametrics
  ansible.builtin.copy:
    src: firewalld/
    dest: /etc/firewalld/services/
    owner: root
    group: root
    mode: "0644"
  notify: Reload firewalld

- name: Flush handlers so firewalld knows the victoriametrics services
  ansible.builtin.meta: flush_handlers

- name: Allow victoriametrics through firewalld
  ansible.posix.firewalld:
    service: victoriametrics
    zone: public
    permanent: true
    state: enabled
  notify:
    - Reload firewalld

- name: Create directory for victoriametrics
  ansible.builtin.file:
    path: /var/lib/victoriametrics
    state: directory
    owner: 1000
    group: 1000
    mode: "0755"

- name: Ensure docker-compose directory exists
  ansible.builtin.file:
    path: /opt/victoriametrics
    state: directory
    mode: "0755"

- name: Copy docker-compose file victoriametrics
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: /opt/victoriametrics/docker-compose.yml
    mode: "0644"
  notify: Restart victoriametrics

- name: Copy auth.yml file
  ansible.builtin.template:
    src: auth.yml.j2
    dest: /opt/victoriametrics/auth.yml
    mode: "0640"
    owner: 1000
    group: 1000
  notify: Restart victoriametrics

- name: Copy systemd service file for victoriametrics
  ansible.builtin.copy:
    src: victoriametrics.service
    dest: /etc/systemd/system/victoriametrics.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so systemd sees victoriametrics
  ansible.builtin.meta: flush_handlers

- name: Enable and start victoriametrics service
  ansible.builtin.systemd_service:
    name: victoriametrics
    enabled: true
    state: started
