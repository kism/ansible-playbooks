---
- name: Reload firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart victoriametrics
  ansible.builtin.systemd_service:
    name: victoriametrics
    state: restarted

# Config is a bind mount, compose up -d won't recreate the container for it
- name: Restart vector
  ansible.builtin.command:
    argv: [docker, restart, vector]
  changed_when: true # only runs when vector.yaml changed
