---
services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    # ports:
    #   - 8428:8428 # Web console (no auth), we don't expose this since docker will punch this through iptables
    command:
      - -retentionPeriod=1y # ~1.8GB/month, so ~22GB steady state, no size based retention in victoriametrics
      - -storage.minFreeDiskSpaceBytes=2GiB # stop ingesting rather than fill the root disk
      - -inmemoryDataFlushInterval=60s # default 5s, each small flush costs ext4 journal + thin-LV metadata writes (~4.5x on vic). Crash loses up to 60s
    volumes:
      - /var/lib/victoriametrics:/victoria-metrics-data
    restart: always
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    # No ports, journald comes in through vmauth /logs, OPNsense syslog through vector
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=10y # ponytail: effectively no time limit, the disk cap below decides what's kept
      - -retention.maxDiskSpaceUsageBytes=10GiB
      - -inmemoryDataFlushInterval=60s # default 5s, each small flush costs ext4 journal + thin-LV metadata writes (~4.5x on vic). Crash loses up to 60s
      - -journald.streamFields=_HOSTNAME,_SYSTEMD_UNIT,CONTAINER_NAME # one stream per unit/container, _MACHINE_ID dropped since cloned CTs can share it
    volumes:
      - /var/lib/victorialogs:/victoria-logs-data
    restart: always
  victorialogs-firewall:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs-firewall
    # OPNsense filterlog only, separate instance so firewall volume can't push journald history out of the cap above
    # No ports, vector writes to it over the compose network, reads go through vmauth /firewall
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=30d
      - -retention.maxDiskSpaceUsageBytes=5GiB
      - -inmemoryDataFlushInterval=60s # default 5s, each small flush costs ext4 journal + thin-LV metadata writes (~4.5x on vic). Crash loses up to 60s
    volumes:
      - /var/lib/victorialogs-firewall:/victoria-logs-data
    restart: always
  vector:
    image: timberio/vector:0.62.0-alpine # pinned, vector.yaml's VRL can break across releases, bump deliberately and run its tests
    container_name: vector
    # All OPNsense syslog: filterlog parsed + GeoIP -> victorialogs-firewall, the rest -> victorialogs, see vector.yaml
    ports:
      - 5514:5514/tcp # Syslog from OPNsense, no auth on syslog so anything on the LAN can push here
    volumes:
      - /opt/victoriametrics/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/lib/geoip:/geoip:ro
    # ponytail: no depends_on, on first deploy vector crash-loops until geoipupdate has written the mmdb (a minute or so)
    restart: always
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:latest
    container_name: geoipupdate
    env_file: geoipupdate.env # account id + license key
    environment:
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-City
      - GEOIPUPDATE_FREQUENCY=72 # hours, keeps running and re-downloads
    volumes:
      - /var/lib/geoip:/usr/share/GeoIP
    restart: always
  vmauth:
    image: victoriametrics/vmauth:latest
    container_name: vmauth
    ports:
      - 8427:8427 # Web console
    volumes:
      - /opt/victoriametrics/auth.yml:/etc/auth.yml
    command:
      - -auth.config=/etc/auth.yml
    restart: always
