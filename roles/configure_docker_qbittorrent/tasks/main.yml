---
- name: Create settings folder structure qbt
  ansible.builtin.file:
    path: "{{ arr_settings_base_dir }}/{{ item }}"
    state: directory
    mode: "0770"
    owner: qbtuser
    group: qbtuser
  with_items:
    - qbittorrent
    - qbittorrent/config
    - qbittorrent/watch
    - gluetun

- name: Create downloads folder structure qbt
  ansible.builtin.file:
    path: "{{ arr_downloads_base_dir }}/torrent"
    state: directory
    mode: "2770"
    owner: qbtuser
    group: qbtuser

- name: Copy docker-compose.yml qbt
  ansible.builtin.template:
    src: templates/hosts/{{ inventory_hostname }}/docker-compose.yml.j2
    dest: "{{ arr_settings_base_dir }}/qbittorrent/docker-compose.yml"
    mode: "0640"
    owner: root
    group: qbtuser

- name: Pull images for docker-compose qbittorrent
  community.docker.docker_compose_v2_pull:
    project_src: "{{ arr_settings_base_dir }}/qbittorrent/"

- name: Allow qBittorrent through firewalld
  ansible.posix.firewalld:
    service: qbittorrent
    zone: public
    permanent: true
    state: enabled
  notify:
    - Reload firewalld
    - Restart docker

- name: Copy systemd service qbt
  ansible.builtin.template:
    src: templates/docker-qbittorrent.service.j2
    dest: /etc/systemd/system/docker-qbittorrent.service
    mode: "0644"

- name: Prepare service qbittorrent
  ansible.builtin.systemd_service:
    service: docker-qbittorrent
    enabled: true
    daemon_reload: true
