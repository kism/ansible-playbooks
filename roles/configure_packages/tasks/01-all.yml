---
- name: Include vars for all-common
  ansible.builtin.include_vars: "all-common.yml"

# ponytail: TEMP migration iotop -> iotop-c, delete these two tasks once all hosts have run
- name: TEMP Gather package facts for iotop migration
  ansible.builtin.package_facts:

- name: TEMP Remove python iotop so iotop-c can be installed
  ansible.builtin.package:
    name: iotop
    state: absent
  when: "'iotop' in ansible_facts['packages']" # keyed by real name, iotop-c only *provides* iotop

- name: Install all-common packages (NON APT)
  ansible.builtin.package:
    name: "{{ configure_packages_to_install }}"
    state: present
  when: ansible_facts["pkg_mgr"] != 'apt'
  register: configure_packages_installed_non_apt

- name: Install all-common packages (APT)
  ansible.builtin.apt:
    name: "{{ configure_packages_to_install }}"
    install_recommends: false
    state: present
  when: ansible_facts["pkg_mgr"] == 'apt'
  register: configure_packages_installed_apt

- name: Remove not-wanted all-common packages
  ansible.builtin.package:
    name: "{{ configure_packages_to_remove }}"
    state: absent

# Re-include vars
- name: Include vars for all-(package manager)
  ansible.builtin.include_vars: 'all-{{ ansible_facts["pkg_mgr"] }}.yml'

- name: Install all-(package manager) packages (NON APT)
  ansible.builtin.package:
    name: "{{ configure_packages_to_install }}"
    state: present
  when: ansible_facts["pkg_mgr"] != 'apt'
  register: configure_packages_installed_non_apt

- name: Install all-(package manager) packages (APT)
  ansible.builtin.apt:
    name: "{{ configure_packages_to_install }}"
    install_recommends: false
    state: present
  when: ansible_facts["pkg_mgr"] == 'apt'
  register: configure_packages_installed_apt

- name: Remove not-wanted all-(package manager) packages
  ansible.builtin.package:
    name: "{{ configure_packages_to_remove }}"
    state: absent
