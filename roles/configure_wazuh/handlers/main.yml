---
- name: Restart Wazuh manager
  ansible.builtin.service:
    name: wazuh-manager
    state: restarted

- name: Restart Wazuh dashboard
  ansible.builtin.service:
    name: wazuh-dashboard
    state: restarted

- name: Reload firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: reloaded
