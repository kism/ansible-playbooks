---
- name: Get nginx service status
  ansible.builtin.systemd_service:
    name: nginx.service
  register: configure_fail2ban_nginx_status

- name: Remove old single nginx-kism jail, replaced by nginx-kism-scan and nginx-kism-404
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/fail2ban/filter.d/nginx-kism.conf
    - /etc/fail2ban/jail.d/nginx-kism.conf
  notify: Restart fail2ban

- name: Copy nginx filters
  ansible.builtin.copy:
    src: "files/filter.d/{{ item }}.conf"
    dest: "/etc/fail2ban/filter.d/{{ item }}.conf"
    mode: "0640"
  loop: "{{ configure_fail2ban_nginx_jails }}"
  notify: Restart fail2ban
  when: configure_fail2ban_nginx_status["status"]["LoadState"] != "not-found"

- name: Copy nginx jails
  ansible.builtin.template:
    src: "templates/jail.d/{{ item }}.conf.j2"
    dest: "/etc/fail2ban/jail.d/{{ item }}.conf"
    mode: "0644"
  loop: "{{ configure_fail2ban_nginx_jails }}"
  notify: Restart fail2ban
  when: configure_fail2ban_nginx_status["status"]["LoadState"] != "not-found"

- name: Copy jail, sshd
  ansible.builtin.template:
    src: templates/jail.d/sshd.conf.j2
    dest: /etc/fail2ban/jail.d/sshd.conf
    mode: "0644"
  notify: Restart fail2ban

- name: Log to Journald
  ansible.builtin.lineinfile:
    path: /etc/fail2ban/fail2ban.conf
    regexp: ^.*logtarget\s*=.*$
    line: logtarget = SYSTEMD-JOURNAL

- name: Enable fail2ban service
  ansible.builtin.systemd_service:
    name: fail2ban.service
    enabled: true
    daemon_reload: true
    state: started
    masked: false
