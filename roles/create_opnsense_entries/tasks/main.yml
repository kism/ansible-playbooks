---
# Hostname feeds the DNS override and DHCP reservation, underscores are invalid there
- name: Ensure inventory hostname is a valid DNS label
  ansible.builtin.assert:
    that: "'_' not in inventory_hostname"
    fail_msg: "{{ inventory_hostname }} contains an underscore, rename it in the inventory (use hyphens)"
    quiet: true

- name: Include tasks for dhcp
  ansible.builtin.include_tasks: 1-dhcp.yml

- name: Include tasks for dns
  ansible.builtin.include_tasks: 2-dns.yml

- name: Include tasks for firewall aliases
  ansible.builtin.include_tasks: 3-alias.yml

# Later roles in the build need the DHCP reservation and DNS record to already be live
- name: Reload kea, unbound and aliases now
  ansible.builtin.meta: flush_handlers
