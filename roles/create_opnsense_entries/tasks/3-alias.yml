---
- name: Create the alias and tag it if needed
  when: target_host_ip_address is defined and target_host_ip_address != homelab_router_ip
  delegate_to: localhost
  become: false
  vars:
    create_opnsense_entries_alias_name: "host_{{ inventory_hostname | lower | replace('-', '_') }}_v4"
  block:
    # Matched by name, the IPv6 equivalents are host_<name>_v6 (dynipv6host, managed by hand)
    - name: Ensure that there is a firewall alias for the host
      oxlorg.opnsense.alias:
        firewall: "{{ opnsense_firewall }}"
        api_key: "{{ secret_opnsense_api_key }}"
        api_secret: "{{ secret_opnsense_api_secret }}"
        name: "{{ create_opnsense_entries_alias_name }}"
        type: "host"
        content: "{{ target_host_ip_address }}"
        description: "{{ ansible_host_description }}"
      notify: Reload alias config

    # The alias module can't set categories, so the rest goes through the API directly
    - name: Tag private addresses with the Internal category
      # RFC1918
      when: target_host_ip_address is match('^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)')
      block:
        - name: Get the firewall categories
          run_once: true
          oxlorg.opnsense.raw:
            firewall: "{{ opnsense_firewall }}"
            api_key: "{{ secret_opnsense_api_key }}"
            api_secret: "{{ secret_opnsense_api_secret }}"
            url: "firewall/category/searchItem"
          register: create_opnsense_entries_categories

        - name: Get the alias uuid
          oxlorg.opnsense.raw:
            firewall: "{{ opnsense_firewall }}"
            api_key: "{{ secret_opnsense_api_key }}"
            api_secret: "{{ secret_opnsense_api_secret }}"
            url: "firewall/alias/getAliasUUID/{{ create_opnsense_entries_alias_name }}"
          register: create_opnsense_entries_alias_uuid

        - name: Get the alias
          oxlorg.opnsense.raw:
            firewall: "{{ opnsense_firewall }}"
            api_key: "{{ secret_opnsense_api_key }}"
            api_secret: "{{ secret_opnsense_api_secret }}"
            url: "firewall/alias/getItem/{{ create_opnsense_entries_alias_uuid.response.uuid }}"
          register: create_opnsense_entries_alias

        - name: Add the Internal category to the alias, keeping any existing categories
          vars:
            create_opnsense_entries_internal_uuid: "{{ (create_opnsense_entries_categories.response.rows | selectattr('name', '==', 'Internal') | first).uuid }}"
            create_opnsense_entries_alias_categories: "{{ create_opnsense_entries_alias.response.alias.categories | dict2items | selectattr('value.selected', 'in', [1, '1']) | map(attribute='key') | list }}"
          when: create_opnsense_entries_internal_uuid not in create_opnsense_entries_alias_categories
          oxlorg.opnsense.raw:
            firewall: "{{ opnsense_firewall }}"
            api_key: "{{ secret_opnsense_api_key }}"
            api_secret: "{{ secret_opnsense_api_secret }}"
            url: "firewall/alias/setItem/{{ create_opnsense_entries_alias_uuid.response.uuid }}"
            action: post
            data:
              alias:
                categories: "{{ create_opnsense_entries_alias_categories | union([create_opnsense_entries_internal_uuid]) | join(',') }}"
