---
- name: Create the alias and tag it if needed
  when: target_host_ip_address is defined and target_host_ip_address != homelab_router_ip
  delegate_to: localhost
  become: false
  vars:
    create_opnsense_entries_alias_base: "host_{{ inventory_hostname | lower | replace('-', '_') }}"
    create_opnsense_entries_alias_name: "{{ create_opnsense_entries_alias_base }}_v4"
  block:
    # Matched by name
    - name: Ensure that there is a firewall alias for the host
      oxlorg.opnsense.alias:
        firewall: "{{ opnsense_firewall }}"
        api_key: "{{ secret_opnsense_api_key }}"
        api_secret: "{{ secret_opnsense_api_secret }}"
        name: "{{ create_opnsense_entries_alias_name }}"
        type: "host"
        content: "{{ target_host_ip_address }}"
        description: "{{ ansible_host_description }}"
      notify: Reload alias config

    # Only the VMs are predictable, configure_misc sets them to EUI-64 SLAAC, so the interface id comes from the MAC.
    # OPNsense prepends the current LAN prefix to the dynipv6host interface id.
    - name: Ensure that there is a firewall alias for the host IPv6
      when: "'proxmoxvms' in group_names"
      vars:
        create_opnsense_entries_mac: "{{ target_host_mac_address | lower | split(':') | map('int', base=16) | list }}"
        # EUI-64: flip the universal/local bit of the first octet, insert ff:fe in the middle
        create_opnsense_entries_eui64: >- # noqa: jinja[invalid] lint renders the MAC octets as strings, real run gives ints
          ::{{ '%x' % ((create_opnsense_entries_mac[0] + 2 - 4 * ((create_opnsense_entries_mac[0] // 2) % 2)) * 256 + create_opnsense_entries_mac[1]) }}:{{
          '%x' % (create_opnsense_entries_mac[2] * 256 + 255) }}:{{
          '%x' % (254 * 256 + create_opnsense_entries_mac[3]) }}:{{
          '%x' % (create_opnsense_entries_mac[4] * 256 + create_opnsense_entries_mac[5]) }}
      oxlorg.opnsense.alias:
        firewall: "{{ opnsense_firewall }}"
        api_key: "{{ secret_opnsense_api_key }}"
        api_secret: "{{ secret_opnsense_api_secret }}"
        name: "{{ create_opnsense_entries_alias_base }}_v6"
        type: "dynipv6host"
        interface: "lan"
        content: "{{ create_opnsense_entries_eui64 }}"
        description: "{{ ansible_host_description }}"
      notify: Reload alias config

    # The alias module can't set categories, so tagging goes through the API directly
    - name: Get the firewall categories
      run_once: true
      oxlorg.opnsense.raw:
        firewall: "{{ opnsense_firewall }}"
        api_key: "{{ secret_opnsense_api_key }}"
        api_secret: "{{ secret_opnsense_api_secret }}"
        url: "firewall/category/searchItem"
      register: create_opnsense_entries_categories

    # v4 when it's RFC1918, v6 always since the dynipv6host aliases are on the lan interface
    - name: Tag aliases with the Internal category
      ansible.builtin.include_tasks: 3-alias-tag.yml
      loop: >-
        {{ ([create_opnsense_entries_alias_name] if target_host_ip_address is match('^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)') else [])
           + ([create_opnsense_entries_alias_base ~ '_v6'] if 'proxmoxvms' in group_names else []) }}
      loop_control:
        loop_var: create_opnsense_entries_tag_alias
