---
- name: Install zsh for dev
  ansible.builtin.package:
    name: zsh
    state: present

- name: Set shell
  ansible.builtin.user:
    name: "{{ homelab_my_username }}"
    shell: /usr/bin/zsh

- name: Make sure the user has a .zshrc
  become: true
  become_user: "{{ homelab_my_username }}"
  ansible.builtin.file:
    path: ~/.zshrc
    state: touch
    mode: "0640"
    access_time: preserve # creates it if missing, leaves an existing one alone
    modification_time: preserve
