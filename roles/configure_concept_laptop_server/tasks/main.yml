---
- name: Assume this is being run on a laptop, disable sleep, hibernate etc
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target
  notify:
    - Restart systemd-logind

- name: Create logind drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    mode: "0755"

# Drop-in, newer systemd doesn't ship /etc/systemd/logind.conf at all
- name: Ignore the lid switch while plugged in
  ansible.builtin.copy:
    content: |
      [Login]
      HandleLidSwitchExternalPower=ignore
    dest: /etc/systemd/logind.conf.d/laptop-server.conf
    mode: "0644"
  notify:
    - Restart systemd-logind
