---
- name: Copy repo file to yum.repos.d
  ansible.builtin.copy:
    src: files/grafana.repo
    dest: /etc/yum.repos.d/grafana.repo
    mode: "0644"

- name: Import Grafana GPG key
  ansible.builtin.rpm_key:
    state: present
    key: https://rpm.grafana.com/gpg.key

- name: Install Grafana
  ansible.builtin.dnf:
    name: grafana
    state: present

- name: Start and enable Grafana service
  ansible.builtin.systemd_service:
    name: grafana-server
    enabled: true
    state: started

- name: Copy firewalld service files
  ansible.builtin.copy:
    src: firewalld/
    dest: /etc/firewalld/services/
    owner: root
    group: root
    mode: "0644"
  notify: Reload firewalld

- name: Flush handlers so firewalld knows the new services
  ansible.builtin.meta: flush_handlers

- name: Allow Grafana and nginx through firewalld
  ansible.posix.firewalld:
    service: "{{ item }}"
    zone: public
    permanent: true
    state: enabled
  loop:
    - grafana
  notify:
    - Reload firewalld
