---
- name: Copy repo file to yum.repos.d
  ansible.builtin.copy:
    src: files/grafana.repo
    dest: /etc/yum.repos.d/grafana.repo
    mode: "0644"

- name: Import Grafana GPG key
  ansible.builtin.rpm_key:
    state: present
    key: https://rpm.grafana.com/gpg.key

- name: Install Grafana
  ansible.builtin.dnf:
    name: grafana
    state: present

# Grafana installs (and auto-updates) these itself on start
- name: Preinstall Grafana plugins
  community.general.ini_file:
    path: /etc/grafana/grafana.ini
    section: plugins
    option: preinstall
    value: victoriametrics-metrics-datasource,victoriametrics-logs-datasource
    mode: "0640"
    group: grafana
  notify: Restart grafana

# Grafana logs every plugin request at info, ~10k lines a day mostly from the alert scheduler
- name: Only log warnings from the VictoriaMetrics plugins
  community.general.ini_file:
    path: /etc/grafana/grafana.ini
    section: log
    option: filters
    value: plugin.victoriametrics-metrics-datasource:warn plugin.victoriametrics-logs-datasource:warn
    mode: "0640"
    group: grafana
  notify: Restart grafana

- name: Provision Grafana datasources
  ansible.builtin.template:
    src: datasources.yaml.j2
    dest: /etc/grafana/provisioning/datasources/ansible.yaml
    mode: "0640"
    group: grafana
  diff: false # contains the vmauth grafana password
  notify: Restart grafana

- name: Start and enable Grafana service
  ansible.builtin.systemd_service:
    name: grafana-server
    enabled: true
    state: started

- name: Copy firewalld service files for grafana
  ansible.builtin.copy:
    src: firewalld/
    dest: /etc/firewalld/services/
    owner: root
    group: root
    mode: "0644"
  notify: Reload firewalld

- name: Flush handlers so firewalld knows the grafana services
  ansible.builtin.meta: flush_handlers

- name: Allow Grafana and nginx through firewalld
  ansible.posix.firewalld:
    service: "{{ item }}"
    zone: public
    permanent: true
    state: enabled
  loop:
    - grafana
  notify:
    - Reload firewalld
