---
- name: Copy firewalld service files
  ansible.builtin.copy:
    src: firewalld/
    dest: /etc/firewalld/services/
    owner: root
    group: root
    mode: "0644"
  notify: Reload firewalld

- name: Flush handlers so firewalld knows the new services
  ansible.builtin.meta: flush_handlers

- name: Allow Minecraft through firewalld
  ansible.posix.firewalld:
    service: minecraft
    zone: public
    permanent: true
    state: enabled
  notify:
    - Reload firewalld
