---
- name: Add my favorite /opt subdirectory
  ansible.builtin.file:
    path: /opt/scripts
    state: directory
    mode: "0775"

- name: Check if kdump is installed
  ansible.builtin.stat:
    path: /etc/init.d/kdump
  register: configure_misc_kdump_installed

- name: Disable kdump service
  ansible.builtin.service:
    name: kdump
    state: stopped
    enabled: false
  when: configure_misc_kdump_installed.stat.exists

- name: Remove anaconda-ks.cfg
  ansible.builtin.file:
    path: /root/anaconda-ks.cfg
    state: absent

- name: Disable services that fail for lxc containers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  when: ansible_facts['virtualization_role'] == 'guest' and ansible_facts['virtualization_type'] == 'lxc'
  with_items:
    - sys-kernel-config.mount
    - sys-kernel-debug.mount

# Vconsole
- name: Check if /etc/vconsole.conf exists
  ansible.builtin.stat:
    path: /etc/vconsole.conf
    follow: true # Debian symlinks this to default/keyboard, which may not exist
  register: configure_misc_vconsole_stat

- name: Check if terminus is installed
  ansible.builtin.stat:
    path: /usr/share/kbd/consolefonts/ter-120n.psf.gz
  register: configure_misc_terminus_font_stat

- name: Set terminal font as terminus
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: "^FONT="
    line: "FONT=ter-120n"
    state: present
  when: configure_misc_vconsole_stat.stat.exists and configure_misc_terminus_font_stat.stat.exists

- name: Set keyboard layout for vconsole
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: "^.*KEYMAP="
    line: "KEYMAP=us"
    state: present
  when: configure_misc_vconsole_stat.stat.exists

# Allow ping
- name: Check that sysctl.d folder exists
  ansible.builtin.stat:
    path: /etc/sysctl.d
  register: configure_misc_sysctl_d_stat

- name: Write file to allow ping if possible
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-allow-ping.conf
    content: |
      net.ipv4.ping_group_range=0 1100
    mode: "0644"
  when: configure_misc_sysctl_d_stat.stat.exists

- name: Create dir for limits.d
  ansible.builtin.file:
    path: /etc/security/limits.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Disable core dump
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-disable-core-dump.conf
    content: |
      * hard core 0
      * soft core 0
    mode: "0644"

# Predictable IPv6, the address is derived from the MAC so create_opnsense_entries can make a v6 alias
- name: Check if NetworkManager conf.d exists
  ansible.builtin.stat:
    path: /etc/NetworkManager/conf.d
  register: configure_misc_nm_conf_d_stat

# ponytail: no handler, applies on next connection activation (reboot), add an nmcli reapply if that bites
- name: Default IPv6 SLAAC addresses to EUI-64 instead of stable-privacy
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/99-ipv6-eui64.conf
    content: |
      [connection]
      ipv6.addr-gen-mode=eui64
    mode: "0644"
  when: configure_misc_nm_conf_d_stat.stat.exists

# libndp sends router solicitations with sa_family unset, the PVE 7.0 kernel rejects that, so NM warns every ~60s.
# Harmless, RAs still arrive unsolicited. Drop when libndp is fixed.
- name: Quiet NetworkManager IPv6 warnings
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/99-quiet-ip6.conf
    content: |
      [logging]
      domains=DEFAULT,IP6:ERR
    mode: "0644"
  when: configure_misc_nm_conf_d_stat.stat.exists and 'proxmoxhosts' not in group_names # PVE uses ifupdown2, never NM
  notify: Apply NetworkManager log level
