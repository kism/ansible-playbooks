---
- name: Restart shairport-sync
  ansible.builtin.systemd_service:
    name: shairport-sync
    state: restarted

- name: Restart raspotify
  ansible.builtin.systemd_service:
    name: raspotify
    state: restarted

- name: Reload firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: reloaded
