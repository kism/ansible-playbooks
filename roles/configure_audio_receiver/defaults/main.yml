---
configure_audio_receiver_name: "{{ inventory_hostname }}"
# Pi onboard 3.5mm jack, change to hw:vc4hdmi for HDMI or a USB DAC's card name
configure_audio_receiver_alsa_device: hw:Headphones
configure_audio_receiver_shairport_version: "5.6.3"
configure_audio_receiver_nqptp_version: "1.2.9"
configure_audio_receiver_build_cache_dir: "/tmp/shairport-sync/{{ configure_audio_receiver_shairport_version }}-{{ configure_audio_receiver_nqptp_version }}"
