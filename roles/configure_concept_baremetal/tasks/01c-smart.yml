---
- name: Install packages for sensors and nvme
  ansible.builtin.apt:
    install_recommends: false
    pkg:
      - nvme-cli
      - lm-sensors
    state: present

- name: Install some hdd related packages apt
  ansible.builtin.apt:
    install_recommends: false
    pkg:
      - hdparm
      - smartmontools
      - rsync
      - libatasmart-bin
    state: present
  when: ansible_facts["pkg_mgr"] == 'apt'

- name: Install some hdd related packages dnf
  ansible.builtin.dnf:
    pkg:
      - hdparm
      - smartmontools
      - rsync
      - libatasmart-bin
    state: present
  when: ansible_facts["pkg_mgr"] == 'dnf'
