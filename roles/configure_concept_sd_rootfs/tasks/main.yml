---
- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

# ponytail: journal in RAM only to spare the SD card, configure_journal_upload ships it to vic.
# Whatever hasn't been uploaded is lost on a crash or reboot, or once a vic outage outgrows RuntimeMaxUse
- name: Keep the journal in RAM
  ansible.builtin.copy:
    content: |
      [Journal]
      Storage=volatile
      RuntimeMaxUse=16M
    dest: /etc/systemd/journald.conf.d/sd-rootfs.conf
    mode: "0644"
  notify: Restart systemd-journald

- name: Remove the old on-disk journal
  ansible.builtin.file:
    path: /var/log/journal
    state: absent

# rsyslog would write everything to /var/log again, and dphys-swapfile swaps onto the card
- name: Remove packages that write to the SD card
  ansible.builtin.apt:
    pkg:
      - rsyslog
      - dphys-swapfile
    state: absent
    purge: true

# rpi-swap (dphys-swapfile's replacement since trixie) defaults to zram with writeback to /var/swap on the card.
# Keep the zram, drop the file. Takes effect on the next reboot, the generator reads it at boot
- name: Create rpi-swap drop-in directory
  ansible.builtin.file:
    path: /etc/rpi/swap.conf.d
    state: directory
    mode: "0755"

- name: Swap to zram only
  ansible.builtin.copy:
    content: |
      [Main]
      Mechanism=zram
    dest: /etc/rpi/swap.conf.d/sd-rootfs.conf
    mode: "0644"

# A file backing an active loop device stays allocated until the reboot detaches it, deleting it early is safe
- name: Remove the rpi-swap file
  ansible.builtin.file:
    path: /var/swap
    state: absent

# Ansible patches this host, so the apt timers only add writes, man-db rebuilds its index after every upgrade
- name: Disable timers that write to the SD card
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - man-db.timer

# fstab only, mounting over a live /tmp hides files running programs have open. Takes effect on the next reboot
- name: Put /tmp in RAM
  ansible.posix.mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: size=64M,mode=1777,nosuid,nodev
    state: present
