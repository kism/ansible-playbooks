---
- name: Install fontconfig
  ansible.builtin.package:
    name:
      - fontconfig
      - libicu
    state: present

- name: Create folders for jellyfin adhoc
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: jellyfin
    group: jellyfin
    recurse: true
    mode: "0755"
  loop:
    - "/var/lib/jellyfin"
    - "/usr/local/lib64/jellyfin"
    - "/usr/share/jellyfin-web"
    - "/var/cache/jellyfin"
    - "/var/log/jellyfin"
    - "/etc/jellyfin"
    - "/opt/jellyfin-ffmpeg"

- name: Add user accounts for jellyfin
  ansible.builtin.user:
    name: "jellyfin"
    create_home: false
    append: false
