---
- name: Assert there are certs to issue
  ansible.builtin.assert:
    that:
      - configure_certbot_certs | length > 0
    fail_msg: Set configure_certbot_certs in the host's host_vars

# ponytail: apt and dnf (EPEL) package names only, Arch calls the plugin certbot-dns-cloudflare
- name: Install certbot
  ansible.builtin.package:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present

- name: Set cloudflare credentials
  ansible.builtin.copy:
    content: "dns_cloudflare_api_token = {{ secret_cloudflare_api_dns }}\n"
    dest: /etc/letsencrypt/cloudflare.ini
    mode: "0600"
  no_log: true

- name: Deploy hook to reload services after a renewal
  ansible.builtin.template:
    src: templates/reload-services.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-services.sh
    mode: "0755"
  when: configure_certbot_reload_services | length > 0

- name: Issue certs
  ansible.builtin.command:
    argv: "{{ base + (item.domains | map('regex_replace', '^', '--domains=') | list) }}"
  vars:
    base:
      - certbot
      - certonly
      - --non-interactive
      - --agree-tos
      - --email={{ secret_email }}
      - --dns-cloudflare
      - --dns-cloudflare-credentials=/etc/letsencrypt/cloudflare.ini
      - --cert-name={{ item.name }}
  loop: "{{ configure_certbot_certs }}"
  loop_control:
    label: "{{ item.name }}"
  register: configure_certbot_issue
  changed_when: "'Certificate not yet due for renewal' not in configure_certbot_issue.stdout" # certbot exits 0 either way
  failed_when: configure_certbot_issue.rc != 0 and 'too many certificates' not in configure_certbot_issue.stderr # Rebuild loops hit the duplicate cert limit, the old cert is still there

# ponytail: one-off for rproxy, which was set up with the creds in /root and a post_hook in the renewal conf.
# certbot doesn't rewrite the renewal conf while the cert isn't due. Delete these three tasks once rproxy has run them
- name: Point renewal conf at the new credentials path
  ansible.builtin.lineinfile:
    path: /etc/letsencrypt/renewal/{{ item.name }}.conf
    regexp: "^dns_cloudflare_credentials\\s*="
    line: dns_cloudflare_credentials = /etc/letsencrypt/cloudflare.ini
  loop: "{{ configure_certbot_certs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove old post_hook, the deploy hook replaces it
  ansible.builtin.lineinfile:
    path: /etc/letsencrypt/renewal/{{ item.name }}.conf
    regexp: "^post_hook\\s*="
    state: absent
  loop: "{{ configure_certbot_certs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove old cloudflare credentials
  ansible.builtin.file:
    path: /root/.cloudflare.ini
    state: absent

- name: Copy certbot renew units
  ansible.builtin.copy:
    src: files/{{ item }}
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - certbot_renew.service
    - certbot_renew.timer

- name: Enable certbot renew timer
  ansible.builtin.systemd_service:
    name: certbot_renew.timer
    enabled: true
    state: started
    daemon_reload: true

# Ours runs on every distro, the packaged ones would renew a second time
- name: Disable distro certbot timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - certbot.timer # Debian
    - certbot-renew.timer # EPEL
  failed_when: false # Each distro ships only one of them
