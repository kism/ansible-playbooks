---
- name: Check if update-motd package is installed
  become: true
  ansible.builtin.stat:
    path: /etc/update-motd.d
  register: configure_motd_dir_to_check

- name: Block to change MOTD if possible
  when: configure_motd_dir_to_check.stat.isdir is defined and configure_motd_dir_to_check.stat.isdir
  block:
    - name: Print message if update-motd is installed
      ansible.builtin.debug:
        msg: update-motd package is installed

    - name: Remove unwanted ubuntu motd files
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: "# Removed by the Kieran w/Ansible "
        mode: "0444"
      loop: "{{ configure_motd_apt_unwanted_files }}"

    # ponytail: one-off cleanup of the old dpkg re-apply hook, dpkg keeps edited conffiles on upgrade/reinstall
    # (tested 2026-11-24, ubuntu 24.04) so it isn't needed. Delete once bigbilly and musicass have run it
    - name: Remove old apt post-invoke motd hook
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/apt.conf.d/99-kglan-motd-cleanup
        - /usr/local/sbin/kglan-motd-cleanup.sh

    - name: Copy motd header
      ansible.builtin.template:
        src: 10-header.j2
        dest: /etc/update-motd.d/10-header
        mode: "0755"

    - name: Copy motd sysinfo
      ansible.builtin.copy:
        src: files/update-motd/50-sysinfo
        dest: /etc/update-motd.d/
        mode: "0755"

    - name: Disable motd-news
      when: ansible_facts['distribution'] == "Ubuntu"  # motd-news only ships on Ubuntu
      ansible.builtin.copy:
        dest: /etc/default/motd-news
        content: |-
          ENABLED=0
          URLS="https://motd.ubuntu.com"
          WAIT=5
        mode: "0644"
        owner: root
        group: root

    - name: Disable motd-news service
      when: ansible_facts['distribution'] == "Ubuntu"  # motd-news only ships on Ubuntu
      ansible.builtin.systemd:
        name: motd-news
        enabled: false
        state: stopped
        masked: true

    - name: Remove cache file if it exists
      ansible.builtin.file:
        path: /var/lib/landscape/landscape-sysinfo-custom.cache
        state: absent
