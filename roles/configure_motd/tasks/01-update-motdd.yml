---
- name: Check if update-motd package is installed
  become: true
  ansible.builtin.stat:
    path: /etc/update-motd.d
  register: configure_motd_dir_to_check

- name: Block to change MOTD if possible
  when: configure_motd_dir_to_check.stat.isdir is defined and configure_motd_dir_to_check.stat.isdir
  block:
    - name: Print message if update-motd is installed
      ansible.builtin.debug:
        msg: update-motd package is installed

    - name: Remove unwanted ubuntu motd files
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: "# Removed by the Kieran w/Ansible "
        mode: "0444"
      loop: "{{ configure_motd_apt_unwanted_files }}"

    - name: Set up apt post-invoke hook to reapply motd cleanup
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/01a-apt-post-hook.yml"
      when: ansible_facts['pkg_mgr'] == "apt"

    - name: Copy motd update files
      ansible.builtin.copy:
        src: files/update-motd/{{ item }}
        dest: /etc/update-motd.d/
        mode: "0755"
      loop:
        - 00-header
        - 50-sysinfo

    - name: Disable motd-news
      ansible.builtin.copy:
        dest: /etc/default/motd-news
        content: |-
          ENABLED=0
          URLS="https://motd.ubuntu.com"
          WAIT=5
        mode: "0644"
        owner: root
        group: root

    - name: Disable motd-news service
      ansible.builtin.systemd:
        name: motd-news
        enabled: false
        state: stopped
        masked: true

    - name: Remove cache file if it exists
      ansible.builtin.file:
        path: /var/lib/landscape/landscape-sysinfo-custom.cache
        state: absent
