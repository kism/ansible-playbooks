# Managed by Ansible, configure_disks
# btrfsmaintenance's btrfs-scrub.sh exits at the first filesystem with errors, so the ones after it never
# get scrubbed, and its config file overrides env vars so it can't be fed one mount at a time.
# Scrub every btrfs mount and still end failed if any had errors.
[Service]
ExecStart=
# $$ because systemd expands $var in ExecStart itself
ExecStart=/bin/sh -c 'rc=0; for m in $$(findmnt -t btrfs -nro TARGET); do echo "Running scrub on $$m"; btrfs scrub start -Bd "$$m" || { echo "Scrub errors on $$m"; rc=1; }; done; exit $$rc'
SyslogIdentifier=btrfs-scrub
