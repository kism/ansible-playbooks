---
- name: Copy firewalld service files for cifs
  ansible.builtin.copy:
    src: firewalld/
    dest: /etc/firewalld/services/
    owner: root
    group: root
    mode: "0644"
  notify: Reload firewalld

- name: Flush handlers so firewalld knows the cifs services
  ansible.builtin.meta: flush_handlers

- name: Run samba install tasks per distro
  ansible.builtin.include_tasks: "01-samba-{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"

- name: Run samba install tasks common
  ansible.builtin.include_tasks: "02-samba-common.yml"

- name: Run fun downloader tasks
  ansible.builtin.include_tasks: "03-downloaders.yml"
