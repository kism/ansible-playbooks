---
- name: Create /opt/cf_dyndns
  ansible.builtin.file:
    path: /opt/cf_dyndns
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy cloudflare dynamic dns script
  ansible.builtin.copy:
    src: cf_dyndns.py
    dest: /opt/cf_dyndns/cf_dyndns.py
    owner: root
    group: root
    mode: "0755"

- name: Copy cloudflare dynamic dns env file
  ansible.builtin.template:
    src: cf_dyndns.env.j2
    dest: /opt/cf_dyndns/cf_dyndns.env
    owner: root
    group: root
    mode: "0600"

- name: Copy cloudflare dynamic dns systemd service
  ansible.builtin.template:
    src: cf_dyndns.service.j2
    dest: /etc/systemd/system/cf_dyndns.service
    owner: root
    group: root
    mode: "0644"

- name: Copy cloudflare dynamic dns systemd timer
  ansible.builtin.copy:
    src: cf_dyndns.timer
    dest: /etc/systemd/system/cf_dyndns.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable cloudflare dynamic dns timer
  ansible.builtin.systemd_service:
    name: cf_dyndns.timer
    enabled: true
    daemon_reload: true
    state: started
