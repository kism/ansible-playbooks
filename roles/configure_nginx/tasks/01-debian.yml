---
- name: Install nginx apt prerequisites debian
  ansible.builtin.apt:
    name:
      - curl
      - gnupg2
      - ca-certificates
      - lsb-release
      - debian-archive-keyring
    state: present
    update_cache: true

- name: Download nginx signing key debian
  ansible.builtin.get_url:
    url: https://nginx.org/keys/nginx_signing.key
    dest: /etc/apt/keyrings/nginx-archive-keyring.asc
    mode: "0644"

- name: Remove old dearmored nginx signing key debian
  ansible.builtin.file:
    path: /usr/share/keyrings/nginx-archive-keyring.gpg
    state: absent

- name: Remove old nginx repo listing debian
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nginx.list
    state: absent

- name: Verify nginx signing key fingerprint debian
  ansible.builtin.command:
    cmd: gpg --dry-run --quiet --no-keyring --import --import-options import-show /etc/apt/keyrings/nginx-archive-keyring.asc
  register: configure_nginx_gpg_check
  changed_when: false # Dry run

- name: Assert nginx signing key fingerprint debian
  ansible.builtin.assert:
    that:
      - "'573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62' in configure_nginx_gpg_check.stdout"
    fail_msg: nginx signing key fingerprint mismatch

- name: Configure nginx mainline apt repository debian
  ansible.builtin.deb822_repository:
    name: nginx
    types: deb
    uris: https://nginx.org/packages/mainline/debian
    suites: "{{ ansible_distribution_release }}"
    components: nginx
    signed_by: /etc/apt/keyrings/nginx-archive-keyring.asc
    install_python_debian: true
    state: present

- name: Pin nginx.org packages debian
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99nginx
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: *
      Pin: origin nginx.org
      Pin: release o=nginx
      Pin-Priority: 900

- name: Install latest nginx mainline package debian
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
