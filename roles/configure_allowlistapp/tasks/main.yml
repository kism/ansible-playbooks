---
- name: Create allowlistapp directory
  ansible.builtin.file:
    path: /opt/allowlistapp
    state: directory
    owner: nginx
    group: nginx
    recurse: true
    mode: u=rwX,g=rwX,o=

- name: Create allowlistapp log file
  ansible.builtin.file:
    path: /var/log/allowlistapp.log
    state: touch
    owner: nginx
    group: nginx
    mode: "0664"
  notify: Restart allowlistapp

- name: Clone allowlistapp
  become: true
  become_user: nginx # Root's umask is 0077, a root clone leaves files nginx can't read
  ansible.builtin.git:
    repo: https://github.com/kism/allowlistapp
    dest: /opt/allowlistapp
    single_branch: true
    version: main
  notify: Restart allowlistapp

- name: Ensure that .venv is writable by nginx user
  ansible.builtin.file:
    path: /opt/allowlistapp/.venv
    state: directory
    owner: nginx
    group: nginx
    mode: u=rwX,g=rwX,o=

- name: Run uv sync
  become: true
  become_user: nginx
  ansible.builtin.command:
    argv: "{{ ['/usr/local/bin/uv', 'sync', '--frozen'] + (['--dry-run'] if ansible_check_mode else []) }}"
    chdir: /opt/allowlistapp
  environment: # App needs python 3.14, keep the uv-downloaded interpreter in /opt rather than nginx's home
    UV_PYTHON_INSTALL_DIR: /opt/allowlistapp/.python
  check_mode: false # --dry-run in check mode, so scripts/plan shows package drift
  register: configure_allowlistapp_uv_sync
  changed_when: configure_allowlistapp_uv_sync.stderr is search('^ [-+~] ', multiline=True) # uv lists each package it (would) change
  notify: Restart allowlistapp

# v0.3 (FastAPI) reads config.json, convert the v0.2 config.toml once. Skipped on fresh installs, the app writes defaults.
- name: Migrate allowlistapp config.toml to config.json
  become: true
  become_user: nginx
  ansible.builtin.command:
    argv:
      - /opt/allowlistapp/.venv/bin/python
      - scripts/migrate_config.py
      - /opt/allowlistapp/instance/config.toml
    chdir: /opt/allowlistapp
    creates: /opt/allowlistapp/instance/config.json
    removes: /opt/allowlistapp/instance/config.toml
  notify: Restart allowlistapp

- name: Copy systemd service allowlistapp
  ansible.builtin.copy:
    src: files/allowlistapp.service
    dest: /etc/systemd/system/allowlistapp.service
    mode: "0644"
  notify: Restart allowlistapp

- name: Enable systemd service allowlistapp
  ansible.builtin.systemd_service:
    name: allowlistapp.service
    enabled: true
    daemon_reload: true
    state: started
    masked: false

- name: Add sudoers rule
  community.general.sudoers:
    name: nginx-allowlistapp
    user: nginx
    commands:
      - /bin/systemctl reload nginx
    nopassword: true
