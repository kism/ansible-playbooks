---
- name: Download uv setup script to tmp
  ansible.builtin.get_url:
    url: "https://astral.sh/uv/install.sh"
    dest: "/tmp/uv_setup.sh"
    mode: "0755"

- name: Install uv
  ansible.builtin.command:
    cmd: "/tmp/uv_setup.sh"
  environment:
    XDG_BIN_HOME: "{{ configure_uv_path }}"
  register: configure_uv_install
  # Only included when uv is missing or self update failed, and the installer always reinstalls
  changed_when: "'installing to' in configure_uv_install.stdout" # installer prints this right before copying the binaries
