---
- name: Clone git repository
  ansible.builtin.git:
    repo: "https://github.com/kism/maxmind_geoip_nginx"
    dest: "/opt/maxmind_geoip_nginx"
    version: "main"
    force: true
    update: true
  notify: Run maxmind_geoip_nginx

- name: Generate .env file for maxmind nginx module
  ansible.builtin.template:
    src: "templates/maxmind_env.j2"
    dest: "/opt/maxmind_geoip_nginx/.env"
    mode: "0600"
  notify: Run maxmind_geoip_nginx

- name: Copy maxmind nginx config
  ansible.builtin.copy:
    src: "files/config.toml"
    dest: "/opt/maxmind_geoip_nginx/config.toml"
    mode: "0644"
  notify: Run maxmind_geoip_nginx

- name: Sync packages
  ansible.builtin.command:
    argv: "{{ ['/usr/local/bin/uv', 'sync'] + (['--dry-run'] if ansible_check_mode else []) }}"
    chdir: "/opt/maxmind_geoip_nginx"
  check_mode: false # --dry-run in check mode, so scripts/plan shows package drift
  register: configure_nginx_maxmind_allowlist_uv_sync
  changed_when: configure_nginx_maxmind_allowlist_uv_sync.stderr is search('^ [-+~] ', multiline=True) # uv lists each package it (would) change

- name: Copy service and timer files
  ansible.builtin.copy:
    src: "files/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - "maxmind_geoip_nginx.service"
    - "maxmind_geoip_nginx.timer"

- name: Enable and start maxmind nginx geoip updater timer
  ansible.builtin.systemd:
    name: "maxmind_geoip_nginx.timer"
    enabled: true
    state: started
    daemon_reload: true
