server {
    server_name vic.kierangee.au;
    location / {
        include /etc/nginx/ipallowlist.conf;
        proxy_pass http://vic.kg.lan:8427/;
        proxy_set_header Host $host;
        # proxy_redirect off;
        # proxy_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Connection "Keep-Alive";

    }
    location /logs/insert/journald/ {
        include /etc/nginx/ipallowlist.conf;
        proxy_pass http://vic.kg.lan:8427/logs/insert/journald/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        client_max_body_size 0; # journal-upload streams big chunked bodies, backfill especially
        proxy_request_buffering off; # pass the stream through instead of spooling it on rproxy
        proxy_read_timeout 300s;
    }
    # ponytail: legacy path, only bigbilly still uses it, remove once it has re-run configure_journal_upload
    location /insert/journald/ {
        include /etc/nginx/ipallowlist.conf;
        proxy_pass http://vic.kg.lan:8427/insert/journald/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        client_max_body_size 0; # journal-upload streams big chunked bodies, backfill especially
        proxy_request_buffering off; # pass the stream through instead of spooling it on rproxy
        proxy_read_timeout 300s;
    }
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/kierangee.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kierangee.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/vhosts/vic.access;
    error_log /var/log/nginx/vhosts/vic.error error;
}

server {
    if ($host = vic.kierangee.au) {
        return 301 https://$host$request_uri;
    }
    server_name vic.kierangee.au;
    listen 80;
    listen [::]:80;
    return 404;
}
