server {
    server_name jsee.kierangee.au;
    location / {
        # AU (geoip) OR allow-list-app, satisfy any lets either pass
        satisfy any;
        include /etc/nginx/ipallowlist.conf;
        auth_request /_geoip;
        proxy_pass http://yoho:5055/;
    }
    location = /_geoip {
        internal;
        if ($geoip_allowed = 0) { return 403; }
        return 204;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/kierangee.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kierangee.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/vhosts/jellyseer.access;
    error_log /var/log/nginx/vhosts/jellyseer.error error;
}

server {
    if ($host = jsee.kierangee.au) {
        return 301 https://$host$request_uri;
    }
    server_name jsee.kierangee.au;
    listen 80;
    listen [::]:80;
    return 404;
}
