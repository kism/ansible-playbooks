---
- name: Create pki directory if it does not exist
  ansible.builtin.file:
    path: /usr/share/nginx/html/pki
    state: directory
    mode: "0755"
    owner: root
    group: root
  changed_when: false # God knows

- name: Set cloudflare key rproxy
  ansible.builtin.copy:
    content: dns_cloudflare_api_token = {{ secret_cloudflare_api_dns }}
    dest: /root/.cloudflare.ini
    mode: "0600"

- name: Initial certbot config rproxy
  ansible.builtin.command:
    cmd: >-
      certbot certonly
      --agree-tos
      --email={{ secret_email }}
      -v
      --non-interactive
      --post-hook "service nginx reload"
      --dns-cloudflare
      --dns-cloudflare-credentials /root/.cloudflare.ini
      -d {{ homelab_domain_external }},*.{{ homelab_domain_external }}
  register: configure_reverse_proxy_certbot_output
  changed_when: false or "Certificate not yet due for renewal" not in configure_reverse_proxy_certbot_output.stdout
  failed_when: configure_reverse_proxy_certbot_output.rc != 0 and not "too many certificates" in configure_reverse_proxy_certbot_output.stderr
  notify: Restart nginx

- name: Debug the command output
  ansible.builtin.debug:
    var: configure_reverse_proxy_certbot_output.stdout_lines

- name: Generate dhparams
  ansible.builtin.command:
    cmd: openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 2048
    creates: /etc/letsencrypt/ssl-dhparams.pem

- name: Set permissions on dhparams
  ansible.builtin.file:
    path: /etc/letsencrypt/ssl-dhparams.pem
    mode: "0644" # This is the certbot default

- name: Block for nginx ssl options
  block:
    - name: Grab nginx ssl options from github
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/certbot/certbot/master/certbot-nginx/certbot_nginx/_internal/tls_configs/options-ssl-nginx.conf
        dest: /etc/letsencrypt/options-ssl-nginx.conf
        mode: "0644"
  rescue:
    - name: Just create an empty file
      ansible.builtin.file:
        path: /etc/letsencrypt/options-ssl-nginx.conf
        state: touch
        mode: "0644"

- name: Copy systemd units for certbot
  ansible.builtin.copy:
    src: files/{{ item }}
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
    owner: root
    group: root
  loop:
    - certbot_renew.service
    - certbot_renew.timer

- name: Enable certbot renew timer
  ansible.builtin.systemd_service:
    name: certbot_renew.timer
    enabled: true
    daemon_reload: true
    state: started
