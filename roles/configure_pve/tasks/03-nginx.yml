---
- name: Install Nginx
  ansible.builtin.apt:
    name:
      - nginx
    state: present

- name: Small change to nginx service
  ansible.builtin.lineinfile:
    path: /lib/systemd/system/nginx.service
    regexp: "^After="
    line: "After=network-online.target remote-fs.target nss-lookup.target pveproxy.service"

- name: Nginx enabled and running pve
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
    daemon_reload: true
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-available/default
    - /etc/nginx/sites-enabled/default

- name: Copy nginx configuration
  ansible.builtin.template:
    src: templates/nginx_pve.conf.j2
    dest: /etc/nginx/sites-available/pve.conf
    mode: "0644"
  notify: Reload nginx

- name: Symlink nginx configuration
  ansible.builtin.file:
    src: /etc/nginx/sites-available/pve.conf
    dest: /etc/nginx/sites-enabled/pve.conf
    state: link
  notify: Reload nginx

# ponytail: one-off cleanup of the old cert fetch timer, delete this task once it has run on both PVE hosts (2026-11-24)
- name: Remove old cert fetch timer
  ansible.builtin.systemd_service:
    name: fetch_pvessl_cert.timer
    enabled: false
    state: stopped
  failed_when: false # Already gone on a second run

- name: Remove old cert fetch files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/fetch_pvessl_cert.timer
    - /etc/systemd/system/fetch_pvessl_cert.service
    - /opt/scripts/fetch_pvessl_cert.sh
    - /etc/ssl/certs/pveproxy-fetched.cer

- name: Systemd units to reload nginx for cert renewals
  ansible.builtin.copy:
    src: "files/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - pve_nginx_reload.service
    - pve_nginx_reload.timer

- name: Enable and start nginx reload timer
  ansible.builtin.systemd_service:
    name: pve_nginx_reload.timer
    enabled: true
    state: started
    daemon_reload: true
