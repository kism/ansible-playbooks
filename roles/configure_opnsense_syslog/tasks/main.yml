---
# All OPNsense syslog goes to vector on this host, which splits firewall logs (filterlog) from the rest,
# see roles/configure_docker_victoriametrics/files/vector.yaml
- name: Forward OPNsense syslog to vector
  delegate_to: localhost
  become: false
  run_once: true
  oxlorg.opnsense.syslog:
    firewall: "{{ opnsense_firewall }}"
    api_key: "{{ secret_opnsense_api_key }}"
    api_secret: "{{ secret_opnsense_api_secret }}"
    target: "{{ inventory_hostname }}.{{ homelab_domain_internal }}"
    port: 5514
    transport: tcp4
    rfc5424: true # 3164 has no timezone or year
    description: "Ansible: victorialogs"
    match_fields: [description]
    reload: true # defaults to false, without it the destination is saved but syslog-ng never sees it

# ponytail: one-off cleanup of the old per-facility split, delete this task once it has run (2026-11-24)
- name: Remove old OPNsense syslog destinations
  delegate_to: localhost
  become: false
  run_once: true
  oxlorg.opnsense.syslog:
    firewall: "{{ opnsense_firewall }}"
    api_key: "{{ secret_opnsense_api_key }}"
    api_secret: "{{ secret_opnsense_api_secret }}"
    target: "{{ inventory_hostname }}.{{ homelab_domain_internal }}"
    description: "{{ item }}"
    match_fields: [description]
    state: absent
    reload: true
  loop:
    - "Ansible: victorialogs local0"
    - "Ansible: victorialogs firewall"
