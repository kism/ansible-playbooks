---
# Points OPNsense remote logging at VictoriaLogs on this host
- name: Forward OPNsense syslog to victorialogs
  delegate_to: localhost
  become: false
  run_once: true
  oxlorg.opnsense.syslog:
    firewall: "{{ opnsense_firewall }}"
    api_key: "{{ secret_opnsense_api_key }}"
    api_secret: "{{ secret_opnsense_api_secret }}"
    target: "{{ inventory_hostname }}.{{ homelab_domain_internal }}"
    port: 514
    transport: tcp4
    rfc5424: true # 3164 has no timezone or year
    # ponytail: firewall logs (filterlog) go to local0, so every facility but that, add local0 back when firewall logs are wanted
    facility: [kern, user, mail, daemon, auth, syslog, lpr, news, uucp, cron, authpriv, ftp, ntp, security, console,
               local1, local2, local3, local4, local5, local6, local7]
    description: "Ansible: victorialogs"
    match_fields: [description]
