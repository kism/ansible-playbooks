---
services:
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    restart: unless-stopped
    command: serve
    labels:
      # Headplane finds headscale by this label
      me.tale.headplane.target: headscale
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    volumes:
      - "./config.yaml:/etc/headscale/config.yaml"
      - "./headscale-data:/var/lib/headscale"

  headplane:
    image: ghcr.io/tale/headplane:latest
    container_name: headplane
    restart: unless-stopped
    depends_on:
      - headscale
    ports:
      - "3000:3000"
    volumes:
      - "./headplane.yaml:/etc/headplane/config.yaml"
      - "./headplane-data:/var/lib/headplane"
      - "./cookie_secret:/etc/headplane/cookie_secret"
      # Must match headscale's mount path, headplane edits it in place
      - "./config.yaml:/etc/headscale/config.yaml"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    healthcheck:
      test: ["CMD", "/bin/hp_healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
