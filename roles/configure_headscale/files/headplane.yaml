---
# https://github.com/tale/headplane/blob/main/config.example.yaml
server:
  host: "0.0.0.0"
  port: 3000
  base_url: "https://hs.kierangee.au"
  cookie_secret_path: "/etc/headplane/cookie_secret"
  cookie_secure: true
  data_path: "/var/lib/headplane"

headscale:
  url: "http://headscale:8080"
  config_strict: true
  config_path: "/etc/headscale/config.yaml"

# Lets headplane find and restart the headscale container after config changes
integration:
  docker:
    enabled: true
    container_label: "me.tale.headplane.target=headscale"
    socket_path: "unix:///var/run/docker.sock"
