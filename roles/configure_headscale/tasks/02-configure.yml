---
# The deb package provides the headscale user and systemd unit


- name: Create headscale configuration directory
  ansible.builtin.file:
    path: /etc/headscale
    state: directory
    owner: headscale
    group: headscale
    mode: "0755"

- name: Copy headscale configuration file
  ansible.builtin.copy:
    src: config.yaml
    dest: /etc/headscale/config.yaml
    owner: headscale
    group: headscale
    mode: "0644"
  notify: Restart headscale

- name: Flush handlers so systemd sees headscale
  ansible.builtin.meta: flush_handlers

- name: Enable and start headscale service
  ansible.builtin.systemd_service:
    name: headscale
    enabled: true
    state: started

- name: Allow headscale through firewall
  ansible.posix.firewalld:
    service: http-alt
    permanent: true
    state: enabled
    immediate: true
