---
- name: Download headscale binary
  ansible.builtin.get_url:
    url: "{{ configure_headscale_release_url }}/{{ configure_headscale_binary_name }}"
    dest: "{{ configure_headscale_install_dir }}/{{ configure_headscale_binary_name }}"
    checksum: "sha256:{{ configure_headscale_release_url }}/checksums.txt"
    owner: root
    group: root
    mode: "0755"

- name: Symlink headscale
  ansible.builtin.file:
    src: "{{ configure_headscale_install_dir }}/{{ configure_headscale_binary_name }}"
    dest: /usr/local/sbin/headscale
    state: link

- name: Create headscale system user
  ansible.builtin.user:
    name: headscale
    home: /var/lib/headscale
    create_home: true
    system: true
    shell: /usr/sbin/nologin

- name: Copy systemd service file for headscale
  ansible.builtin.copy:
    src: headscale.service
    dest: /etc/systemd/system/headscale.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
