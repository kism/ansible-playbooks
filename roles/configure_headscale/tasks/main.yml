---
- name: Create headscale directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /opt/headscale
    - /opt/headscale/headscale-data
    - /opt/headscale/headplane-data

- name: Generate headplane cookie secret
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
    dest: /opt/headscale/cookie_secret
    force: false
    owner: root
    group: root
    mode: "0600"

# ponytail: force false on config.yaml since headplane edits it in place, delete it on the host to re-push
- name: Copy headscale config
  ansible.builtin.copy:
    src: config.yaml
    dest: /opt/headscale/config.yaml
    force: false
    owner: root
    group: root
    mode: "0600"
  notify: Restart headscale

- name: Copy headplane config and docker compose file
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/headscale/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - headplane.yaml
    - docker-compose.yml
  notify: Restart headscale

- name: Pull images for docker-compose headscale
  community.docker.docker_compose_v2_pull:
    project_src: /opt/headscale

- name: Copy systemd service file for headscale
  ansible.builtin.copy:
    src: headscale.service
    dest: /etc/systemd/system/headscale.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so systemd sees headscale
  ansible.builtin.meta: flush_handlers

- name: Enable and start headscale service
  ansible.builtin.systemd_service:
    name: headscale
    enabled: true
    state: started

- name: Allow headscale and headplane through firewall
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - 8080/tcp
    - 3000/tcp
