---
- name: Download headscale deb
  ansible.builtin.get_url:
    url: "{{ configure_headscale_release_url }}/{{ configure_headscale_binary_name }}.deb"
    dest: "{{ configure_headscale_install_dir }}/{{ configure_headscale_binary_name }}.deb"
    checksum: "sha256:{{ configure_headscale_release_url }}/checksums.txt"
    owner: root
    group: root
    mode: "0644"

- name: Install headscale deb package
  ansible.builtin.apt:
    deb: "{{ configure_headscale_install_dir }}/{{ configure_headscale_binary_name }}.deb"
