---
- name: Create headplane directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /opt/headplane
    - /opt/headplane/data

- name: Generate headplane cookie secret
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
    dest: /opt/headplane/cookie_secret
    force: false
    owner: root
    group: root
    mode: "0600"

- name: Copy headplane config and docker compose file
  ansible.builtin.copy:
    src: "headplane/{{ item }}"
    dest: "/opt/headplane/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - config.yaml
    - docker-compose.yml
  notify: Restart headplane

- name: Pull images for docker-compose headplane
  community.docker.docker_compose_v2_pull:
    project_src: /opt/headplane

- name: Copy systemd service file for headplane
  ansible.builtin.copy:
    src: headplane.service
    dest: /etc/systemd/system/headplane.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so systemd sees headplane
  ansible.builtin.meta: flush_handlers

- name: Enable and start headplane service
  ansible.builtin.systemd_service:
    name: headplane
    enabled: true
    state: started

- name: Allow headplane through firewall
  ansible.posix.firewalld:
    port: 3000/tcp
    permanent: true
    state: enabled
    immediate: true
