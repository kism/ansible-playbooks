---
- name: Set architecture and install method
  ansible.builtin.set_fact:
    configure_headscale_use_deb: "{{ ansible_facts['os_family'] == 'Debian' }}"
    configure_headscale_arch: "{{ configure_headscale_arch_map[ansible_facts['architecture']] }}"

- name: Get latest headscale release from github api
  ansible.builtin.uri:
    url: "https://api.github.com/repos/juanfont/headscale/releases/latest"
  register: configure_headscale_github
  when: configure_headscale_version == "latest"

- name: Resolve headscale version
  ansible.builtin.set_fact:
    configure_headscale_resolved_version: >-
      {{ configure_headscale_github.json.tag_name | regex_replace('^v', '')
         if configure_headscale_version == "latest" else configure_headscale_version }}

- name: Set binary filename
  ansible.builtin.set_fact:
    configure_headscale_binary_name: >-
      headscale_{{ configure_headscale_resolved_version }}_linux_{{ configure_headscale_arch }}{{ '.deb' if configure_headscale_use_deb else '' }}

- name: Create install directory
  ansible.builtin.file:
    path: "{{ configure_headscale_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check if binary already exists
  ansible.builtin.stat:
    path: "{{ configure_headscale_install_dir }}/{{ configure_headscale_binary_name }}"
  register: configure_headscale_binary_stat

- name: Download and verify headscale binary
  when: not configure_headscale_binary_stat.stat.exists
  block:
    - name: Fetch checksums.txt
      ansible.builtin.uri:
        url: "https://github.com/juanfont/headscale/releases/download/v{{ configure_headscale_resolved_version }}/checksums.txt"
        return_content: true
      register: configure_headscale_checksums

    - name: Extract checksum for binary
      ansible.builtin.set_fact:
        configure_headscale_checksum: >-
          {{ (configure_headscale_checksums.content.splitlines()
              | select('search', configure_headscale_binary_name ~ '$')
              | first).split()[0] }}

    - name: Download headscale binary
      ansible.builtin.get_url:
        url: "https://github.com/juanfont/headscale/releases/download/v{{ configure_headscale_resolved_version }}/{{ configure_headscale_binary_name }}"
        dest: "{{ configure_headscale_install_dir }}/{{ configure_headscale_binary_name }}"
        checksum: "sha256:{{ configure_headscale_checksum }}"
        owner: root
        group: root
        mode: "0755"
