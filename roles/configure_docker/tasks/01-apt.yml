---
- name: Remove old repo files
  ansible.builtin.file:
    path: /etc/apt/sources.list.d
    state: absent

- name: Remove unofficial packages
  ansible.builtin.apt:
    pkg:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
    state: absent

- name: Remove old apt key
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: absent

- name: Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
    signed_by: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg
    install_python_debian: true
    state: present

- name: Install docker packages apt
  ansible.builtin.package:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  notify: Restart docker service
