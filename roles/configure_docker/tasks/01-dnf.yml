---
- name: Remove podman packages
  ansible.builtin.dnf:
    name:
      - podman-docker
      - podman
      - podman-compose
    state: absent

- name: Add Docker Repo
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/oracle/docker-ce.repo # Docker's own OL repo, same packages and gpg key as the centos one we used before
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: "0644"
    force: true # existing hosts still have the centos repo file, get_url never replaces an existing file without this

- name: Update DNF Cache
  ansible.builtin.dnf:
    update_cache: true

- name: Install docker packages dnf
  ansible.builtin.package:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-pip
      - python3-packaging # ansible.builtin.pip needs it, not in the ol10 rootfs
    state: present
  notify: Restart docker service

- name: Install docker pip packages
  ansible.builtin.pip:
    name:
      - docker
    state: present
