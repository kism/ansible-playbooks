---
- name: Remove podman packages
  ansible.builtin.dnf:
    name:
      - podman-docker
      - podman
      - podman-compose
    state: absent

# ponytail: one-off cleanup, delete these two once code, hs, kismnas, myr, stream, vic, yoho have run them
- name: Find old centos docker repo file
  ansible.builtin.find:
    paths: /etc/yum.repos.d
    patterns: docker-ce.repo
    contains: ".*centos.*"
  register: configure_docker_old_repo

- name: Remove old centos docker repo file
  ansible.builtin.file:
    path: "{{ item['path'] }}"
    state: absent
  loop: "{{ configure_docker_old_repo['files'] }}"

- name: Add Docker Repo
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/oracle/docker-ce.repo # Docker's own OL repo, same packages and gpg key as the centos one we used before
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: "0644"

- name: Update DNF Cache
  ansible.builtin.dnf:
    update_cache: true

- name: Install docker packages dnf
  ansible.builtin.package:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  notify: Restart docker service
