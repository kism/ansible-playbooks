---
name: ansible-taste
on:
  push:
    branches:
      - main

jobs:
  taste:
    name: Ansible Taste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install python dependencies
        run: uv sync --locked

      - name: Run ansible-taste
        run: uv run ansible-taste

      - name: Check docker compose stacks get updated
        if: ${{ !cancelled() }} # Run even if ansible-taste failed, they're independent checks
        run: uv run scripts/compose_audit.py

      - name: Check every nginx vhost logs to its own files
        if: ${{ !cancelled() }} # Run even if an earlier check failed, they're independent checks
        run: uv run scripts/nginx_logging_audit.py

      - name: Check facts are only used via ansible_facts
        if: ${{ !cancelled() }} # Run even if an earlier check failed, they're independent checks
        run: uv run scripts/injected_facts_audit.py

      - name: Check no task always reports changed (scripts/plan drift)
        if: ${{ !cancelled() }} # Run even if an earlier check failed, they're independent checks
        run: uv run scripts/check_mode_audit.py
