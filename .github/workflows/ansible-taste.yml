---
name: ansible-taste
on:
  push:
    branches:
      - main

jobs:
  taste:
    name: Ansible Taste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Install python dependencies
        run: uv sync --locked

      - name: Run ansible-taste
        run: uv run ansible-taste
