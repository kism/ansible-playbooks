---
- name: Configure users adhoc
  hosts: ansible_main
  become: true
  become_user: root
  gather_facts: true
  roles:
    - meta_pre_flight_checks
    - configure_users

- name: Setup ent jumpbox
  hosts: ent
  gather_facts: false
  become: true
  roles:
    - configure_jumpbox

- name: Setup remotecode
  hosts: code
  gather_facts: true
  become: true
  roles:
    - configure_dev_environment
